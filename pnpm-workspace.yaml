allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - astro@7.2.1

# Force-upgrade transitive dependencies that ship with
# known security advisories. These are pulled in through
# tooling (Lighthouse CI, OG image rendering) — none are
# runtime-exposed — but `pnpm audit` flags them and upstream releases of
# `@lhci/cli` / satori haven't rolled forward yet.
#
# (Versions below are Renovate-pinned; the floors that matter are
# the ones the advisories name.)
#
# - yaml — removed 2026-09. yaml-language-server now pins 2.8.3
#                   itself, already past GHSA-48c2-rrv3-qjmp's ≥2.8.3.
# - uuid (≥11.1.1) — patches GHSA-w5hq-g745-h8pq (missing buffer
#                   bounds check in v3/v5/v6). Pulled in via
#                   @lhci/cli. v11 is a major bump from the version
#                   @lhci/cli resolves on its own; validated that
#                   `pnpm lhci` still runs green against it.
# - tmp (≥0.2.6)  — patches GHSA-ph9p-34f9-6g65 (path traversal via
#                   unsanitized `prefix`/`postfix` enabling directory
#                   escape). Supersedes the earlier ^0.2.4 pin for
#                   GHSA-52f5-9888-hmc6 (symlink `dir` write) — 0.2.5
#                   resolved against ^0.2.4 and is still vulnerable to
#                   the newer advisory. Pulled in twice via @lhci/cli
#                   (direct and via inquirer → external-editor).
# - esbuild — removed 2026-09. Astro, Vite and wrangler all resolve
#                   ≥0.28.1 on their own, past GHSA-gv7w-rqvm-qjhr and
#                   GHSA-g7r4-m6w7-qqqr.
# - vite — no override needed after the Astro 7 upgrade. Astro now
#                   resolves Vite 8+, which is already above the
#                   vulnerable range for GHSA-fx2h-pf6j-xcff.
# - js-yaml — removed 2026-09, and don't bring it back unscoped. Astro's
#                   helpers resolve a patched 4.x on their own, and the
#                   blanket pin also forced `@lhci/utils` (which wants
#                   ^3.13.1) onto v4, which dropped the `yaml.safeLoad` it
#                   calls. That only held because lighthouserc is JSON. Its
#                   own 3.15.2 isn't flagged by GHSA-h67p-54hq-rp68.
# - fflate (≥0.7.5) — patches GHSA-px8p-9vwx-vf98 (`unzipSync` infinite
#                   loop on malformed ZIP64 archives). satori pins
#                   `fflate: 0.7.3` exactly, still true as of satori 0.33.5,
#                   so no refresh can reach it. Build-time only (OG image
#                   rendering over our own fonts). 0.7.5 is already in the
#                   tree via satori → @shuding/opentype.js, so this dedupes
#                   to one copy rather than adding a version.
#
# Revisit when upstream releases pick up the patched transitives
# natively — these overrides can then be removed.

overrides:
  uuid: 11.1.1
  tmp: 0.2.7
  fflate: 0.7.5
