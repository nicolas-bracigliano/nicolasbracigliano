name: security

on:
  schedule:
    # Daily at 22:00 UTC. CVE disclosure → exploit-in-the-wild can be hours;
    # weekly was too slow. Cost: ~4 free CI-minutes/day.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions: {}

# Force any Node.js action that hasn't bumped to Node 24 yet to run
# on Node 24 anyway. GitHub deprecated Node 20 actions on
# 2025-09-19; Node 20 will be removed from the runner on
# 2026-09-16, with a forced switch on 2026-06-02. Setting the env
# var explicitly now:
#   1. Silences the per-run "Node.js 20 actions are deprecated"
#      warning that `gitleaks/gitleaks-action@v2.3.9` currently
#      triggers (the action is still on Node 20 and the project
#      is dormant — v2.3.9 is the latest release).
#   2. Surfaces any Node 24 incompatibility now, in a controlled
#      window, rather than on 2026-06-02 when the switch becomes
#      forced.
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    name: Dependency audit + license check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (prod, fail on high+)
        run: pnpm audit --prod --audit-level=high
      # `continue-on-error: true` (step-level) lets the step's real
      # exit code surface in the run UI as a non-blocking signal,
      # instead of the `|| true` shell mask that always reports the
      # step as success. The dependent upload-artifact step still
      # runs via `if: always()` below regardless of this step's
      # outcome.
      - name: pnpm audit (full report, non-failing)
        if: always()
        continue-on-error: true
        run: pnpm audit --json > audit.json
      - name: License allow-list
        run: |
          pnpm exec license-checker --production --excludePrivatePackages --onlyAllow \
            "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;CC0-1.0;0BSD;Unlicense"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pnpm-audit-${{ github.run_id }}
          path: audit.json
          retention-days: 90
          if-no-files-found: ignore

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      # `gitleaks-action@v2.3.9` still targets Node 20; the project
      # is dormant. The env var below opts the action into Node 24
      # ahead of the 2026-06-02 forced switch and silences the loud
      # deprecation warning. Remove this once gitleaks-action ships
      # a Node-24-targeting release, or by 2026-09-16 when Node 20
      # is removed from runners (whichever comes first).
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          config-file: .github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:javascript-typescript'

  security-txt-expires:
    name: security.txt expiry guard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check security.txt Expires (>=30 days)
        run: |
          expires=$(grep -i '^Expires:' public/.well-known/security.txt | sed 's/Expires:[[:space:]]*//')
          if [ -z "$expires" ]; then echo "::error::no Expires line in security.txt"; exit 1; fi
          days=$(( ( $(date -d "$expires" +%s) - $(date +%s) ) / 86400 ))
          echo "security.txt expires in $days day(s) ($expires)"
          if [ "$days" -lt 30 ]; then
            echo "::error::Expires < 30 days — rotate before publishing."
            exit 1
          fi
