name: release-please

on:
  push:
    branches: [main]
  # Manual trigger via `gh workflow run release-please.yml` or the
  # Actions tab. Useful for re-running after a token rotation or
  # to nudge the release PR open without pushing a no-op commit.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Maintain release PR + cut GitHub Release on merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
