name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger from the CLI (`gh workflow run ci.yml`) or
  # the Actions tab. Useful for re-running against the latest
  # main without pushing a no-op commit, e.g. after rotating
  # secrets or upgrading runner-side dependencies.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches; never cancel main (deploys must finish).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Prettier check
        run: pnpm format:check
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: HTML validate
        run: pnpm exec html-validate "dist/**/*.html"
      - name: Pagefind index sanity
        run: |
          test -f dist/_pagefind/pagefind-entry.json
          grep -q '"version"' dist/_pagefind/pagefind-entry.json
      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 30
          if-no-files-found: error

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Run Lighthouse CI
        run: pnpm lhci
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 30
          if-no-files-found: ignore

  e2e:
    name: E2E tests (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium (+ system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Run Playwright tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30
          if-no-files-found: ignore

  deploy-check:
    name: Check deploy prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      ready: ${{ steps.cf.outputs.ready }}
    steps:
      - name: Verify Cloudflare credentials are configured
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice::Cloudflare credentials not configured — skipping deploy. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repo (or environment) secrets to enable."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Cloudflare Workers
    # Gated on every quality check (build, lighthouse perf budget, e2e a11y
    # + behaviour) plus the secrets presence. Lighthouse parallel with e2e
    # rather than inside build so wall-clock time isn't bottlenecked on it.
    needs: [build, lighthouse, e2e, deploy-check]
    if: needs.deploy-check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      # `production` for main pushes, `preview` for PRs. GitHub auto-creates
      # both environments on first reference; protection rules can be added
      # in repo settings without changing this file.
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout (needed for wrangler.toml + src/worker.ts)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # `pnpm install` here so wrangler is already in `node_modules`
      # at the version pinned in `package.json` (4.93.1 today).
      # Without it, `cloudflare/wrangler-action`'s "is wrangler
      # already installed?" probe (`npx --no-install wrangler
      # --version`) misses, the action falls back to
      # `npm i wrangler@^4.21` in the project root, and npm trips
      # on a pre-existing peer-dep conflict between eslint 10 and
      # `eslint-plugin-jsx-a11y`'s peer `eslint@^3-^9`. Letting
      # pnpm seed `node_modules` first sidesteps the install path
      # entirely. Cost: ~15 s extra for the pnpm install (most
      # files cached by the pnpm-store).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      # `cloudflare/wrangler-action@v4` (May 2026) bundles Wrangler v4
      # by default. v4.21+ adds `--preview-alias` support for the
      # `versions upload` command, which we use for non-`main`
      # deploys. Action SHA-pinned per the repo's third-party-
      # action policy. `packageManager: pnpm` matches what was
      # used to install wrangler in the step above — the action's
      # `npx --no-install wrangler --version` probe then finds the
      # locally-installed binary and skips its own install step.
      - name: Authenticate (wrangler whoami)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '^4.21'
          packageManager: pnpm
          command: whoami
      # Two deploy paths, one step. `main` pushes go to production
      # (`wrangler deploy`, lands at the canonical Worker URL plus
      # the custom domain). Non-`main` pushes upload a preview
      # version with the shared `preview` alias, accessible at
      # `preview-<worker>.<account>.workers.dev` — single shared
      # preview URL rather than per-branch aliasing (the latter
      # would need DNS-safe alias names + retention management).
      # Both commands write a `deployment-url` step output via
      # wrangler's WRANGLER_OUTPUT_DIR artifact, which the
      # `environment.url` field above picks up.
      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '^4.21'
          packageManager: pnpm
          command: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'versions upload --preview-alias=preview' }}
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::wrangler-action did not emit a deployment-url — skipping smoke test"
            exit 0
          fi
          echo "Smoke-testing $URL"
          # Root path is the Worker entry — it 302-redirects to
          # /{locale}/ based on Accept-Language (see src/worker.ts).
          root_status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --retry 3 --retry-delay 2 "$URL/")
          if [ "$root_status" != "302" ] && [ "$root_status" != "200" ]; then
            echo "::error::Expected 302 or 200 at /, got $root_status"; exit 1
          fi
          # /en/ and /es/ should be 200 static HTML.
          en_status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --retry 3 --retry-delay 2 "$URL/en/")
          es_status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --retry 3 --retry-delay 2 "$URL/es/")
          if [ "$en_status" != "200" ]; then echo "::error::Expected 200 at /en/, got $en_status"; exit 1; fi
          if [ "$es_status" != "200" ]; then echo "::error::Expected 200 at /es/, got $es_status"; exit 1; fi
          echo "Smoke test passed (/, /en/, /es/)"
