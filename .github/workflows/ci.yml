name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger from the CLI (`gh workflow run ci.yml`) or
  # the Actions tab. Useful for re-running against the latest
  # main without pushing a no-op commit, e.g. after rotating
  # secrets or upgrading runner-side dependencies.
  workflow_dispatch:

permissions: {}

# Workflow-level env: disable Astro's anonymous telemetry on every
# job. Builds stay deterministic, no upstream pings during CI, and
# no need to repeat the same flag inside individual steps. Per
# https://astro.build/config/#telemetry.
env:
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches; never cancel main (deploys must finish).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Detect which paths a PR/push actually changes. Used to short-
  # circuit the heavyweight `lighthouse` and `e2e` jobs when only
  # docs are touched — the runnable build still goes through
  # (catches an Astro/TS regression in a doc-adjacent file) but
  # we skip ~3 minutes of perf + browser tests.
  #
  # `code` matches anything that could affect rendered output OR
  # the CI behaviour itself; the negation list keeps pure-docs PRs
  # from triggering the heavy jobs.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'public/**'
              - 'tests/**'
              - 'scripts/**'
              - 'astro.config.*'
              - 'wrangler.toml'
              - 'lighthouserc.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
              - 'tsconfig.json'
              - 'playwright.config.ts'
              - 'lefthook.yml'
              - '.npmrc'
              - '.nvmrc'
              - 'stylelint.config.*'
              - 'eslint.config.*'
              - '.prettierrc*'
              - '.prettierignore'

  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      # Enforce ADR 0009: every `uses:` ref in `.github/workflows/`
      # must be `@<40-char SHA> # vTAG`. Catches floating refs,
      # unannotated SHAs, and any future drift back toward `@vN`.
      - name: Lint workflow pins (ADR 0009)
        run: pnpm lint:actions
      - name: Prettier check
        run: pnpm format:check
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: HTML validate
        run: pnpm exec html-validate "dist/**/*.html"
      - name: Pagefind index sanity
        run: |
          test -f dist/_pagefind/pagefind-entry.json
          grep -q '"version"' dist/_pagefind/pagefind-entry.json
      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 30
          if-no-files-found: error

  lighthouse:
    name: Lighthouse CI
    needs: [build, changes]
    # Skip when only docs/config-comment changes — the build job
    # still runs and verifies the site compiles, but we don't burn
    # ~2 minutes running Lighthouse against output that didn't
    # change. `vars.LHCI_FORCE` lets a maintainer override.
    if: needs.changes.outputs.code == 'true' || vars.LHCI_FORCE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Run Lighthouse CI
        run: pnpm lhci
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 30
          if-no-files-found: ignore

  e2e:
    name: E2E tests (Playwright)
    needs: [build, changes]
    # Same skip-on-docs-only as `lighthouse` above. The Playwright
    # browser install + run is the most expensive job; docs PRs
    # don't need it.
    if: needs.changes.outputs.code == 'true' || vars.E2E_FORCE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium (+ system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Run Playwright tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30
          if-no-files-found: ignore

  deploy-check:
    name: Check deploy prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      ready: ${{ steps.cf.outputs.ready }}
    steps:
      - name: Verify Cloudflare credentials are configured
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice::Cloudflare credentials not configured — skipping deploy. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repo (or environment) secrets to enable."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Cloudflare Workers
    # Gated on every quality check (build, lighthouse perf budget,
    # e2e a11y + behaviour) plus the secrets presence. Lighthouse
    # parallel with e2e rather than inside build so wall-clock time
    # isn't bottlenecked on it.
    #
    # `needs.lighthouse.result` and `needs.e2e.result` allow
    # `'skipped'` because the path-filter `changes` job can skip
    # them on docs-only PRs — we still want a preview deploy for
    # those, since the goal is "see the rendered docs change
    # before merging".
    needs: [changes, build, lighthouse, e2e, deploy-check]
    # Default-deny posture for the deploy: every upstream job must
    # have produced a clear signal. If `changes` (paths-filter)
    # failed for a transient reason, `lighthouse`/`e2e` would
    # skip with no real signal — allowing deploy in that case
    # would ship code without the quality gates running. Require
    # `changes` to have succeeded; allow `lighthouse`/`e2e` to
    # be `'skipped'` only because the path-filter intentionally
    # skipped them on a docs-only PR.
    if: |
      needs.deploy-check.outputs.ready == 'true'
      && needs.changes.result == 'success'
      && needs.build.result == 'success'
      && (needs.lighthouse.result == 'success' || needs.lighthouse.result == 'skipped')
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      # `production` for main pushes, `preview` for PRs. GitHub auto-creates
      # both environments on first reference; protection rules can be added
      # in repo settings without changing this file.
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout (needed for wrangler.toml + src/worker.ts)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # `pnpm install` here so wrangler is already in `node_modules`
      # at the version pinned in `package.json` (4.93.1 today).
      # Without it, `cloudflare/wrangler-action`'s "is wrangler
      # already installed?" probe (`npx --no-install wrangler
      # --version`) misses, the action falls back to
      # `npm i wrangler@^4.21` in the project root, and npm trips
      # on a pre-existing peer-dep conflict between eslint 10 and
      # `eslint-plugin-jsx-a11y`'s peer `eslint@^3-^9`. Letting
      # pnpm seed `node_modules` first sidesteps the install path
      # entirely. Cost: ~15 s extra for the pnpm install (most
      # files cached by the pnpm-store).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      # `cloudflare/wrangler-action@v4` (May 2026) bundles Wrangler v4
      # by default. v4.21+ adds `--preview-alias` support for the
      # `versions upload` command, which we use for non-`main`
      # deploys. Action SHA-pinned per the repo's third-party-
      # action policy. `packageManager: pnpm` matches what was
      # used to install wrangler in the step above — the action's
      # `npx --no-install wrangler --version` probe then finds the
      # locally-installed binary and skips its own install step.
      - name: Authenticate (wrangler whoami)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '^4.21'
          packageManager: pnpm
          command: whoami
      # Two deploy paths, one step. `main` pushes go to production
      # (`wrangler deploy`, lands at the canonical Worker URL plus
      # the custom domain). Non-`main` pushes upload a preview
      # version with the shared `preview` alias, accessible at
      # `preview-<worker>.<account>.workers.dev` — single shared
      # preview URL rather than per-branch aliasing (the latter
      # would need DNS-safe alias names + retention management).
      # Both commands write a `deployment-url` step output via
      # wrangler's WRANGLER_OUTPUT_DIR artifact, which the
      # `environment.url` field above picks up.
      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '^4.21'
          packageManager: pnpm
          command: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'versions upload --preview-alias=preview' }}
      # Functional smoke test: assert every route that has to keep
      # working in production returns the expected status. Catches
      # a botched Astro build, a worker.ts regression, or a
      # Cloudflare-side asset-binding hiccup before traffic hits
      # the real domain.
      - name: Smoke test (routes)
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::wrangler-action did not emit a deployment-url — skipping smoke test"
            exit 0
          fi
          echo "Smoke-testing $URL"
          # Map of "path => expected status". The Worker handles `/`
          # (Accept-Language 302); everything else falls through to
          # the ASSETS binding with `not_found_handling = "404-page"`
          # serving `dist/404.html` for unmatched paths.
          #
          # Retry note: `curl --retry` only retries on 5xx + network
          # errors, NOT on 4xx — a 404 during the post-deploy asset-
          # propagation window would otherwise give up after one
          # attempt. We wrap the curl call in an explicit bash retry
          # so transient 404s (an asset uploaded a moment ago but not
          # yet served at this edge) get a fair shake before we fail
          # the build. Observed in run 26442160867: ES slug returned
          # 404 while same-build EN slug returned 200 within the
          # immediate post-deploy window; both 200 a minute later.
          # Six attempts × 3 s delay = ~18 s tolerance per route.
          check() {
            local path="$1" expected="$2"
            local got attempt=0
            while [ $attempt -lt 6 ]; do
              got=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$URL$path")
              if [ "$got" = "$expected" ]; then
                echo "  $path → $got ✓"
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 3
            done
            echo "::error::$path expected $expected, got $got (after $attempt retries)"
            return 1
          }
          # Worker-handled (redirect)
          check /            302 || exit 1
          # Static asset matches (route entries Astro built)
          check /en/         200 || exit 1
          check /es/         200 || exit 1
          check /en/notes/   200 || exit 1
          check /en/works/   200 || exit 1
          check /en/pieces/  200 || exit 1
          check /en/pieces/rings-i-keep-redrawing/ 200 || exit 1
          check /en/about/   200 || exit 1
          check /en/colophon/ 200 || exit 1
          check /es/notas/   200 || exit 1
          check /es/obras/   200 || exit 1
          check /es/ensayos/ 200 || exit 1
          check /es/ensayos/anillos-que-sigo-redibujando/ 200 || exit 1
          check /es/sobre/   200 || exit 1
          # `colofón` in percent-encoded form — curl sends the literal
          # UTF-8 byte for `ó`, and Cloudflare normalizes that to the
          # `%C3%B3n` form via a 307 redirect, breaking the immediate-
          # status assertion. Hitting the canonical encoded URL directly
          # is equivalent (Astro's `_redirects` also points the unaccented
          # variant `/es/colofon` here).
          check /es/colof%C3%B3n/ 200 || exit 1
          # 404 fallback: unmatched path serves dist/404.html with
          # HTTP 404. Confirms `not_found_handling = "404-page"` is
          # honoured at the Workers Static Assets layer.
          check /this-path-does-not-exist-12345/ 404 || exit 1
          echo "Smoke test passed (16 routes)"

          # Body content sanity: status codes alone don't catch a
          # broken Astro build that produces empty HTML. Fetch
          # `/en/` and assert a known marker shows up — title tag
          # AND the site's wordmark from the chrome. Cheap; would
          # have caught a hypothetical "Astro emitted empty pages
          # after a refactor" regression that ships 200s.
          echo "Body content sanity at /en/"
          body=$(curl -sS --max-time 15 --retry 3 --retry-delay 2 "$URL/en/")
          if ! echo "$body" | grep -q '<title>'; then
            echo "::error::/en/ response missing <title> — broken Astro build?"
            exit 1
          fi
          if ! echo "$body" | grep -q 'Bracigliano'; then
            echo "::error::/en/ response missing 'Bracigliano' — broken Astro build?"
            exit 1
          fi
          echo "  body contains <title> + wordmark ✓"
      # Security headers verification: every header declared in
      # `public/_headers` must reach the browser. Catches the
      # `_headers` file silently dropping (Astro not copying it),
      # Cloudflare overriding a value, or a typo breaking the
      # parser. Runs against the `/en/` page so the top-level
      # global rule (`/*`) is exercised.
      - name: Smoke test (security headers)
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::no deployment-url — skipping headers smoke test"
            exit 0
          fi
          echo "Verifying security headers at $URL/en/"
          headers=$(curl -sSI --max-time 15 --retry 3 --retry-delay 2 "$URL/en/")
          required=(
            "content-security-policy"
            "strict-transport-security"
            "x-content-type-options"
            "referrer-policy"
            "permissions-policy"
            "cross-origin-opener-policy"
            "cross-origin-resource-policy"
            "x-frame-options"
          )
          missing=()
          for h in "${required[@]}"; do
            if ! echo "$headers" | grep -iq "^$h:"; then
              missing+=("$h")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing security headers on /en/:"
            for h in "${missing[@]}"; do echo "  - $h"; done
            echo ""
            echo "Full response headers received:"
            echo "$headers"
            exit 1
          fi
          # Also assert `server: cloudflare` so we know we're
          # hitting the CDN, not a misconfigured origin.
          if ! echo "$headers" | grep -iq '^server: cloudflare'; then
            echo "::error::Missing 'server: cloudflare' header — request didn't go through the CDN."
            echo "$headers"
            exit 1
          fi
          echo "All ${#required[@]} security headers present + server: cloudflare ✓"
      # Sticky comment on the PR with the preview URL. `sticky-pull-
      # request-comment` keeps a single comment updated rather than
      # accumulating one per push. PRs that aren't on `main` (so
      # `github.event.pull_request.number` is set) get the comment;
      # main pushes skip it (no PR to comment on).
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != ''
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: cf-preview
          message: |
            ### Cloudflare preview deploy

            **${{ steps.deploy.outputs.deployment-url }}**

            Updated on commit `${{ github.event.pull_request.head.sha }}` · single shared `preview` alias, so any subsequent push to any open PR replaces this URL with that branch's build.
