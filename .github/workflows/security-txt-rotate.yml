name: security-txt rotate

on:
  schedule:
    # 1st of each month at 22:00 UTC. RFC 9116 Expires should never lapse;
    # checking monthly with a 60-day rotation threshold means the renewal PR
    # has plenty of time to be reviewed and merged.
    - cron: '0 22 1 * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate security.txt if Expires < 60 days
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Check current Expires
        id: check
        run: |
          expires=$(grep -i '^Expires:' public/.well-known/security.txt | sed 's/Expires:[[:space:]]*//')
          if [ -z "$expires" ]; then
            echo "::error::No Expires line in security.txt"; exit 1
          fi
          days_left=$(( ( $(date -d "$expires" +%s) - $(date +%s) ) / 86400 ))
          echo "Current Expires: $expires"
          echo "Days remaining:  $days_left"
          if [ "$days_left" -lt 60 ]; then
            new_expires=$(date -u -d "+1 year" +"%Y-%m-%dT00:00:00.000Z")
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "new_expires=$new_expires" >> "$GITHUB_OUTPUT"
            echo "current_expires=$expires" >> "$GITHUB_OUTPUT"
            echo "days_left=$days_left" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::security.txt Expires has $days_left days remaining; no rotation needed."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update Expires in security.txt
        if: steps.check.outputs.needed == 'true'
        run: |
          sed -i "s|^Expires:.*|Expires: ${{ steps.check.outputs.new_expires }}|" public/.well-known/security.txt
          echo "Updated Expires to ${{ steps.check.outputs.new_expires }}"
      - name: Open rotation PR
        if: steps.check.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7.0.5
        with:
          commit-message: 'chore(security): rotate security.txt Expires to ${{ steps.check.outputs.new_expires }}'
          title: 'chore(security): rotate security.txt Expires'
          branch: chore/security-txt-rotate
          delete-branch: true
          labels: |
            security
            automated
          body: |
            Auto-generated by the `security-txt rotate` workflow.

            The `Expires` field in `public/.well-known/security.txt` is
            **${{ steps.check.outputs.days_left }} days** from lapsing
            (`${{ steps.check.outputs.current_expires }}`), which is below the
            60-day rotation threshold. Bumping to one year from today.

            - Old: `${{ steps.check.outputs.current_expires }}`
            - New: `${{ steps.check.outputs.new_expires }}`

            CI's `security-txt-expires` guard in `security.yml` validates the
            new value; merge once it goes green.
