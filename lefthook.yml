pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,ts,tsx,astro}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{js,ts,tsx,astro,css,md,json,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.{ts,tsx,astro}'
      run: pnpm exec tsc --noEmit --incremental
    stylelint:
      glob: '*.css'
      run: pnpm exec stylelint {staged_files}
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --no-banner
        else
          echo "gitleaks not installed; skipping staged-secret scan (install via 'brew install gitleaks')"
        fi

pre-push:
  commands:
    signed-commits:
      # The git pre-push protocol streams refs on stdin (`local_ref local_sha
      # remote_ref remote_sha`). Lefthook does NOT forward stdin to the script
      # — the old `while read` form here ran zero iterations and silently
      # passed, which is how every commit in this repo's history is unsigned.
      # Compute the range from the upstream-tracking branch instead.
      #
      # Only enforce when commit signing is configured. Contributors without
      # signing set up get a no-op so initial setup doesn't block them; once
      # they enable `commit.gpgsign`, the check becomes hard-blocking.
      run: |
        if [ "$(git config --get commit.gpgsign 2>/dev/null)" != "true" ]; then
          exit 0
        fi
        branch=$(git symbolic-ref --short HEAD 2>/dev/null) || exit 0
        upstream=$(git rev-parse --abbrev-ref "${branch}@{upstream}" 2>/dev/null) || upstream=""
        range="${upstream:+${upstream}..}HEAD"
        unsigned=$(git log --format='%H %G?' "$range" 2>/dev/null | awk '$2 != "G" && $2 != "U" {print $1}')
        if [ -n "$unsigned" ]; then
          echo "ERROR: unsigned commits in push range (commit.gpgsign=true but signature missing):"
          echo "$unsigned"
          echo ""
          echo "Likely causes: signing key passphrase not entered, key not loaded in ssh-agent, or --no-gpg-sign used."
          exit 1
        fi
