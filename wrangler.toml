# Cloudflare Worker with Static Assets — hosts the Astro build at
# `nicolas-bracigliano.<account>.workers.dev` and at the custom
# domain `nicolasbracigliano.com`.
#
# `name` MUST match the Worker on Cloudflare exactly. Renaming
# here orphans the existing Worker and creates a new one
# alongside; the Cloudflare dashboard shows the canonical name at
# the top of the project page.
name = "nicolas-bracigliano"

# `compatibility_date` pins the Workers runtime semantics. Bump
# every few months to pick up engine improvements. Each date's
# behaviour changes are catalogued at
# developers.cloudflare.com/workers/configuration/compatibility-dates.
compatibility_date = "2026-05-24"

# Worker entry point. Handles the one dynamic route on the site:
# the `/` path does an Accept-Language redirect to `/en/` or
# `/es/`. Everything else is served directly from the static-asset
# binding below — the Worker is bypassed entirely for paths that
# match an asset.
main = "src/worker.ts"

# `src/worker.ts` imports `public/.well-known/security.txt` as a string
# to serve it directly (Workers Static Assets won't serve dot-prefixed
# dirs). wrangler's built-in default would bundle it as Text, but we
# declare the rule explicitly so the dependency is visible and survives
# any change to wrangler's defaults. `fallthrough = true` keeps the
# built-in rules active for everything else (and silences the
# shadow-warning the bare rule would emit).
rules = [{ type = "Text", globs = ["**/.well-known/security.txt"], fallthrough = true }]

[assets]
# Astro outputs the built site here. Uploaded as part of the
# Worker deployment; static files (HTML, CSS, fonts, OG PNGs,
# the ⌘K search index at /cmdk/*.json) are served from Cloudflare's
# edge without invoking the Worker — assets win for every path that has
# one, except the two explicitly listed in `run_worker_first` below.
directory = "./dist"

# When no asset matches a request, serve the built `dist/404.html`
# with HTTP 404 status. Default (`none`) returns Cloudflare's
# generic error page, which would discard the hand-crafted
# Misplaced Letter 404 from PR #25.
not_found_handling = "404-page"

# Bind the assets fetcher into the Worker's `env` so the entry
# in `src/worker.ts` can delegate non-`/` requests via
# `env.ASSETS.fetch(request)`. `ASSETS` is the convention; any
# binding name works.
binding = "ASSETS"

# Run the Worker before the static-asset lookup, but ONLY for the two
# paths `src/worker.ts` actually handles.
#
# Why it's needed at all: without it, Cloudflare's assets layer intercepts
# `/` (no `dist/index.html` matches → `not_found_handling = "404-page"`
# serves `dist/404.html` directly) and the Worker is never invoked, so
# `acceptLanguageRedirect` in `src/worker.ts` is dead code on the deployed
# Worker. Observed in PR #54: browser hits `/` returned the 404 page
# (cf-cache-status: HIT on the cached 404), while curl from a different
# edge / cache state reached origin and got the 302.
#
# Why a LIST and not `true`: `true` routes every request through the Worker
# — HTML, CSS, JS, fonts, OG PNGs — each one paying a Worker invocation and
# an extra hop only to fall through to `env.ASSETS.fetch(request)` on the
# very next line. The two paths below are the complete set the Worker has
# its own branch for; everything else is asset-served, so scoping costs
# nothing and takes the Worker out of the hot path for ~100% of traffic.
# (Side effect worth knowing: only these two paths can produce Worker
# invocation logs now — see `[observability]` below.)
#
# Pattern syntax is Cloudflare's route matcher: an exact path matches only
# itself, a trailing `/*` matches a prefix, and a leading `!` negates. So
# `"/"` is the root alone, NOT a prefix for everything under it. Both entries
# mirror a branch in `src/worker.ts`'s `fetch` — keep them in sync, and note
# that the security.txt path is exported as `SECURITY_TXT_PATH` from
# `src/lib/security-txt.ts` (this file can't import it, so it's the one
# duplicated literal).
#
# Post-deploy verification: `scripts/smoke-routes.ts` asserts `/` → 302 and
# a 200 at `SECURITY_TXT_PATH` on every deploy, so a mis-scoped pattern here
# fails CI rather than silently reverting the redirect to dead code.
run_worker_first = ["/", "/.well-known/security.txt"]

# `_headers` and `_redirects` from `public/` are copied into
# `dist/` by Astro at build time. Cloudflare Workers Static
# Assets reads both at deploy time — no extra config required.
# The redirect for `/es/colofon` → `/es/colofón` and every
# security header in `_headers` flow through automatically.

# Collect logs and traces to debug your Worker, persist in
# the dashboard or export to external providers
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

