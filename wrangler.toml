# Static Astro build with a small Worker for redirects and security.txt.
# Changing the Worker name creates a different deployment target.
name = "nicolas-bracigliano"

compatibility_date = "2026-05-24"

main = "src/worker.ts"

rules = [{ type = "Text", globs = ["**/.well-known/security.txt"], fallthrough = true }]

[assets]
directory = "./dist"

not_found_handling = "404-page"

binding = "ASSETS"

# Required for the root redirect, security.txt, and legacy locale redirects.
# Locale prefixes also enable page-level Worker observability.
run_worker_first = ["/", "/.well-known/security.txt", "/en/*", "/es/*"]

# Server-side observability; no client analytics beacon. Nested enabled
# flags override the parent: update all three when changing this setting.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
